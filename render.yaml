# Render Blueprint: deploys the Laravel API + admin panel from backend/Dockerfile.
# In Render: New > Blueprint > pick this repo. Values marked "sync: false" are asked for once.
services:
  - type: web
    name: kinetic-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /up
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: DB_CONNECTION
        value: mysql
      # From the Aiven service's "Connection information" panel
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        value: defaultdb
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      # Contents of Aiven's CA certificate (ca.pem)
      - key: MYSQL_SSL_CA_PEM
        sync: false
      # Address of the React site, e.g. https://kinetic-gym.vercel.app
      - key: FRONTEND_URL
        sync: false
      # First staff login for /admin
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
