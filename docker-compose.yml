# Run the whole stack:  APP_KEY=base64:... docker compose up --build
# Website: http://localhost:8080   Admin panel + API docs: http://localhost:8000/admin, /docs
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: kinetic_gym
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      APP_KEY: ${APP_KEY:?Set APP_KEY. Generate one with "php artisan key:generate --show"}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: kinetic_gym
      DB_USERNAME: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-change-me}
      FRONTEND_URL: http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"

  web:
    build: ./client
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  db-data:
